name: Setup xv6 Dual-Arch Toolchain
description: Install RISC-V, LoongArch64, e2fsprogs, and QEMU dependencies matching Dockerfile.

runs:
  using: composite
  steps:
    - name: Install cross-toolchains and QEMU
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          make gcc libc6-dev python3 perl bc expect \
          e2fsprogs \
          gcc-riscv64-unknown-elf gcc-riscv64-linux-gnu \
          gcc-14-loongarch64-linux-gnu \
          qemu-system-misc qemu-utils
        sudo apt-get install -y --no-install-recommends qemu-system-riscv || true

    - name: Verify toolchain environment
      shell: bash
      run: bash tests/check_env.sh
