name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  repo-checks:
    name: Repo Hygiene & Static Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check markdown links, tracked files, and IPC purity
        run: python3 .github/scripts/check_repo.py

      - name: Check shell and Python script syntax
        run: |
          set -euo pipefail
          bash -n tests/check_env.sh tests/run_all.sh tests/full_usertests.sh tests/*/run.sh
          python3 -m py_compile tests/runner/run_qemu_case.py src/test-xv6.py .github/scripts/check_repo.py

  web:
    name: Web Console Tests & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run server unit tests
        run: npm test

      - name: Build production frontend
        run: npm run build

  qemu-suites:
    name: QEMU VFS/SMP Suites (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [riscv, loongarch]
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup-xv6-toolchain

      - name: Build kernel and fs.img (${{ matrix.arch }})
        run: |
          set -euo pipefail
          make -C src ARCH="${{ matrix.arch }}" clean
          make -C src ARCH="${{ matrix.arch }}" kernel/kernel fs.img

      - name: Run VFS, filesystem, persistence, and SMP suites
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"
          PREFIX=""
          if [ "$ARCH" = "loongarch" ]; then
            PREFIX="loongarch_"
          fi

          SUITES=(
            public_vfs
            ext2
            fat32
            error
            semantics
            persist
            smp
            mount_lifecycle
            remount_io
            mount_storm
          )

          failed=0
          for s in "${SUITES[@]}"; do
            target="${PREFIX}${s}"
            echo "::group::Suite ${target}"
            start_ts=$(date +%s)
            if make "$target" && make run; then
              elapsed=$(( $(date +%s) - start_ts ))
              echo "PASS: ${target} (${elapsed}s)"
            else
              elapsed=$(( $(date +%s) - start_ts ))
              echo "::error::FAIL: ${target} (${elapsed}s)"
              if [ -f "tests/${s}/logs/build.log" ]; then
                echo "--- tests/${s}/logs/build.log (tail) ---"
                tail -n 80 "tests/${s}/logs/build.log" || true
              fi
              for log in tests/"${s}"/logs/*.log; do
                [ -f "$log" ] || continue
                [ "$(basename "$log")" = "build.log" ] && continue
                echo "--- ${log} (tail) ---"
                tail -n 80 "$log" || true
              done
              failed=1
            fi
            echo "::endgroup::"
          done

          exit "$failed"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-suites-logs-${{ matrix.arch }}
          path: tests/*/logs/
          if-no-files-found: ignore

  qemu-baseline:
    name: QEMU Baseline Quick (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [riscv, loongarch]
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup-xv6-toolchain

      - name: Run usertests -q (${{ matrix.arch }})
        run: |
          set -euo pipefail
          if [ "${{ matrix.arch }}" = "loongarch" ]; then
            target="loongarch_baseline"
          else
            target="test_baseline"
          fi
          if ! (make "$target" && make run); then
            if [ -f tests/test_baseline/logs/build.log ]; then
              echo "--- tests/test_baseline/logs/build.log (tail) ---"
              tail -n 80 tests/test_baseline/logs/build.log || true
            fi
            exit 1
          fi

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-baseline-logs-${{ matrix.arch }}
          path: tests/test_baseline/logs/
          if-no-files-found: ignore
